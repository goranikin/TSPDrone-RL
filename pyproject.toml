[project]
name = "tspdrone-rl"
version = "0.1.0"
description = "Deep RL for the Traveling Salesman Problem with Drone"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.0",
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.64",
]
