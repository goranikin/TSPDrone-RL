[project]
name = "tspdrone-rl"
version = "0.1.0"
description = "Deep RL for the Traveling Salesman Problem with Drone"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.0",
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

# Torch 2.13 dropped cu128; PyPI defaults to cu130 (needs a newer driver).
# Pin Linux to cu126 so CUDA 12.8 drivers (nvidia-smi CUDA Version 12.8) work.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
